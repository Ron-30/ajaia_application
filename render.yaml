# Render Blueprint: one free web service + one free Postgres database.
# Deploy: Render dashboard → New → Blueprint → select this repo → Apply.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString

databases:
  - name: ajaia-docs-db
    plan: free
    databaseName: ajaia_docs
    ipAllowList: []   # no public access; only Render services on the private network can connect
